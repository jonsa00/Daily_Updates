name: Refresh dashboard

on:
  schedule:
    - cron: "7 * * * *"   # hourly; minute 7 avoids GitHub's busy top-of-hour queue
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # keep-alive commit below
  pages: write
  id-token: write

# A newer build cancels any older one still queued or running, so a build that gets stuck on
# GitHub's side (as one did waiting at the github-pages environment for 30h) can't block the rest.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Last good copy of each feed and the article-image lookups, carried between runs.
      - uses: actions/cache/restore@v4
        with:
          path: |
            cache.json
            images.json
          key: feed-state-${{ github.run_id }}
          restore-keys: feed-state-

      - name: Build
        env:
          DASHBOARD_OUT: site/index.html
        run: |
          python3 build_dashboard.py
          cp icon.png site/

      - uses: actions/cache/save@v4
        with:
          path: |
            cache.json
            images.json
          key: feed-state-${{ github.run_id }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4

      # GitHub pauses scheduled workflows after 60 days without repo activity.
      - name: Keep schedule alive
        if: github.event_name == 'schedule'
        run: |
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt $(( 45 * 86400 )) ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "Keep hourly schedule active"
            git push
          fi
