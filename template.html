<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Daily Updates">
<meta name="theme-color" content="#f6f4ef" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#151514" media="(prefers-color-scheme: dark)">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23b4441c'/%3E%3Ctext x='32' y='45' font-family='Georgia' font-size='36' font-weight='700' fill='white' text-anchor='middle'%3EDU%3C/text%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="icon.png">
<title>Daily Updates</title>
<style>
:root {
  --bg: #f6f4ef; --panel: #ffffff; --ink: #1d1d1b; --muted: #6b6a66; --line: #e3dfd6;
  --accent: #b4441c; --indie: #2f6f5e; --chip: #efebe2; --new: #b4441c;
  --up: #1a7f4b; --down: #c0362c;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #151514; --panel: #1e1e1c; --ink: #ecebe7; --muted: #9a988f; --line: #2f2e2b;
          --accent: #e8794f; --indie: #6cc3a8; --chip: #2a2926; --new: #e8794f;
          --up: #4cc38a; --down: #f0705f; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink);
       font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif; }
a { color: inherit; text-decoration: none; }
header { position: sticky; top: 0; z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line);
         padding: 14px 20px 10px; }
.top { display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap; }
h1 { font: 700 26px/1 Georgia, "Times New Roman", serif; margin: 0; letter-spacing: -.01em; }
.meta { color: var(--muted); font-size: 13px; }
.controls { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; align-items: center; }
input[type=search] { flex: 1 1 220px; max-width: 360px; padding: 7px 10px; border: 1px solid var(--line);
                     border-radius: 8px; background: var(--panel); color: var(--ink); font: inherit; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; background: var(--panel); color: var(--muted); padding: 7px 11px; font: inherit;
              font-size: 13px; cursor: pointer; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button.on { background: var(--ink); color: var(--bg); }
.tabs { display: none; }
main { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; padding: 18px 20px 40px; }
section { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; min-width: 0; }
section > h2 { font: 700 18px Georgia, serif; margin: 0; padding: 14px 16px 6px; display: flex;
               justify-content: space-between; align-items: baseline; }
section > h2 small { font: 400 12px -apple-system, sans-serif; color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 5px; padding: 4px 16px 10px; border-bottom: 1px solid var(--line); }
.chip { font-size: 11.5px; padding: 3px 8px; border-radius: 99px; background: var(--chip); color: var(--muted);
        cursor: pointer; border: 1px solid transparent; user-select: none; }
.chip:hover { border-color: var(--line); color: var(--ink); }
.chip.on { background: var(--ink); color: var(--bg); }
ol { list-style: none; margin: 0; padding: 0; }
li { padding: 12px 16px; border-bottom: 1px solid var(--line); display: grid;
     grid-template-columns: 108px minmax(0, 1fr); column-gap: 12px; align-items: start; }
li .body { display: grid; gap: 4px; min-width: 0; }
.thumb { display: block; width: 108px; aspect-ratio: 4 / 3; border-radius: 8px; overflow: hidden;
         background: var(--ph, var(--chip)); position: relative; }
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .3s; }
li:hover .thumb img { transform: scale(1.04); }
.thumb.noimg::after { content: attr(data-i); position: absolute; inset: 0; display: grid; place-items: center;
                      color: #fff; font: 700 22px Georgia, serif; opacity: .9; }
li.hero { grid-template-columns: 1fr; row-gap: 10px; padding-top: 14px; }
li.hero .thumb { width: 100%; aspect-ratio: 16 / 9; border-radius: 10px; }
li.hero .thumb.noimg::after { font-size: 44px; }
li.hero .t { font: 700 20px/1.25 Georgia, serif; }
li.read .thumb { opacity: .55; }
li:last-child { border-bottom: 0; }
li.read .t { color: var(--muted); }
.src { font-size: 11.5px; color: var(--muted); display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.src b { color: var(--accent); font-weight: 600; }
.src b.indie { color: var(--indie); }
.badge { font-size: 10px; text-transform: uppercase; letter-spacing: .04em; color: var(--new); font-weight: 700; }
.t { font-weight: 600; font-size: 15.5px; line-height: 1.3; }
.t:hover { text-decoration: underline; }
.s { color: var(--muted); font-size: 13.5px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.empty { padding: 20px 16px; color: var(--muted); }
footer { padding: 0 20px 30px; color: var(--muted); font-size: 12.5px; }
footer details summary { cursor: pointer; }
footer table { border-collapse: collapse; margin-top: 8px; }
footer td { padding: 2px 12px 2px 0; }
.bad { color: var(--accent); }
/* Markets: full-width band with the indicator board above a multi-column story list */
section.wide { grid-column: 1 / -1; }
.board { padding: 6px 16px 14px; border-bottom: 1px solid var(--line); display: grid; gap: 12px; }
.board h3 { margin: 0 0 6px; font-size: 11.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.tile { border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px 6px; display: grid; gap: 1px; min-width: 0; }
.tile .n { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tile .p { font: 600 16px/1.2 -apple-system, sans-serif; font-variant-numeric: tabular-nums; }
.tile .p small { font-size: 10.5px; color: var(--muted); font-weight: 400; margin-left: 3px; }
.tile .c { font-size: 12.5px; font-variant-numeric: tabular-nums; font-weight: 600; }
.up { color: var(--up); } .down { color: var(--down); } .flat { color: var(--muted); }
.tile svg { width: 100%; height: 26px; display: block; margin-top: 2px; }
.tile .w { font-size: 10.5px; color: var(--muted); display: flex; justify-content: space-between; gap: 4px; white-space: nowrap; }
.tile.stale { opacity: .6; }
ol[dir=rtl] .t, ol[dir=rtl] .s { font-family: "Geeza Pro", "Noto Naskh Arabic", "Segoe UI", Tahoma, sans-serif; line-height: 1.55; }
ol[dir=rtl] .src { direction: ltr; justify-content: flex-end; }
section.wide ol { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); }
.more { display: block; width: calc(100% - 32px); margin: 4px 16px 14px; padding: 8px; border: 1px solid var(--line);
        border-radius: 8px; background: var(--panel); color: var(--ink); font: inherit; font-size: 13px; cursor: pointer; }
@media (max-width: 1000px) {
  .tabs { display: inline-flex; }
  main { grid-template-columns: 1fr; }
  main section { display: none; }
  main section.active { display: block; }
}
@media (max-width: 600px) { header, main, footer { padding-left: 12px; padding-right: 12px; }
  li { grid-template-columns: 84px minmax(0, 1fr); } .thumb { width: 84px; }
  .board { padding: 4px 12px 12px; }
  .tiles { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
  .tile { padding: 6px 7px 5px; } .tile .p { font-size: 13.5px; } .tile .c { font-size: 11.5px; }
  .tile .p small { display: none; } .tile svg { height: 20px; } }
</style>
</head>
<body>
<header>
  <div class="top">
    <h1>Daily Updates</h1>
    <span class="meta" id="stamp"></span>
  </div>
  <div class="controls">
    <input type="search" id="q" placeholder="Filter headlines…">
    <div class="seg" id="kind">
      <button data-v="all" class="on">All</button>
      <button data-v="mainstream">Mainstream</button>
      <button data-v="independent">Independent</button>
    </div>
    <div class="seg" id="win">
      <button data-v="12">12h</button>
      <button data-v="24">24h</button>
      <button data-v="48" class="on">48h</button>
    </div>
    <div class="seg tabs" id="tabs"></div>
  </div>
</header>
<main id="main"></main>
<footer id="foot"></footer>
<script>
const DATA = /*__DATA__*/null;
const store = {
  get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
};
const state = { q: "", kind: "all", hours: 48, more: new Set(), tab: store.get("du.tab", DATA.sections[0].id),
                pick: new Set(store.get("du.pick2", [])), read: new Set(store.get("du.read", [])) };
const lastVisit = store.get("du.lastVisit", null);
store.set("du.lastVisit", DATA.generated);

const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function ago(iso) {
  if (!iso) return "";
  const m = Math.round((Date.now() - new Date(iso)) / 60000);
  if (m < 60) return m + "m ago";
  if (m < 1440) return Math.round(m / 60) + "h ago";
  return Math.round(m / 1440) + "d ago";
}
const PALETTE = ["#b4441c", "#2f6f5e", "#3d5a99", "#8a5a2b", "#6b3fa0", "#a03f5c", "#2c7a8c", "#5e6b2f"];
const hue = s => PALETTE[[...s].reduce((h, c) => (h * 31 + c.charCodeAt(0)) >>> 0, 7) % PALETTE.length];
const initials = s => s.replace(/\(.*?\)|!/g, "").split(/[\s-]+/).filter(w => /^[A-ZÀ-Ý0-9]/.test(w)).map(w => w[0]).join("").slice(0, 3);
// A lead story whose picture fails to load swaps places with the next story.
function broken(img) {
  const li = img.closest("li"), next = li.nextElementSibling;
  img.parentNode.classList.add("noimg"); img.remove();
  if (li.classList.contains("hero") && next) {
    li.classList.remove("hero"); next.classList.add("hero"); li.before(next);
  }
}
// ---- market board
const num = (v, d) => v.toLocaleString(undefined, { minimumFractionDigits: d, maximumFractionDigits: d });
const digits = q => /=X$/.test(q.symbol) && Math.abs(q.price) < 10 ? 4 : 2;  // FX pairs get 4 decimals
const CUR = { USX: "¢", USD: "USD", CAD: "CAD", EUR: "EUR", GBP: "GBP", GBp: "p", JPY: "JPY", HKD: "HKD", CNY: "CNY" };
function spark(vals, cls) {
  if (!vals || vals.length < 2) return "";
  const lo = Math.min(...vals), hi = Math.max(...vals), span = hi - lo || 1;
  const pts = vals.map((v, i) => `${(i / (vals.length - 1) * 100).toFixed(1)},${(24 - (v - lo) / span * 22 + 1).toFixed(1)}`).join(" ");
  return `<svg viewBox="0 0 100 26" preserveAspectRatio="none" class="${cls}" aria-hidden="true">
    <polyline points="${pts}" fill="none" stroke="currentColor" stroke-width="1.5" vector-effect="non-scaling-stroke"/></svg>`;
}
function tile(q) {
  const yieldPct = q.unit === "%";
  const dir = !q.change ? "flat" : q.change > 0 ? "up" : "down";
  const arrow = { up: "▲", down: "▼", flat: "•" }[dir];
  const price = yieldPct ? num(q.price, 2) + "%" : num(q.price, digits(q));
  const chg = q.change == null ? "–" : yieldPct
    ? `${arrow} ${q.change > 0 ? "+" : ""}${Math.round(q.change * 100)} bp`
    : `${arrow} ${q.pct > 0 ? "+" : ""}${num(q.pct, 2)}%`;
  const when = q.time ? new Date(q.time) : null;
  const sameDay = when && when.toDateString() === new Date().toDateString();
  const asOf = when ? (sameDay ? when.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", hour12: false })
                               : when.toLocaleDateString([], { month: "short", day: "numeric" })) : "";
  const mdir = q.month_pct == null ? "flat" : q.month_pct >= 0 ? "up" : "down";
  const cur = yieldPct || /^\^|DX-Y/.test(q.symbol) || /=X$/.test(q.symbol) ? "" : (CUR[q.currency] ?? q.currency ?? "");
  return `<div class="tile ${q.stale ? "stale" : ""}" title="${esc(q.symbol)}${q.stale ? " — last good quote (latest fetch failed)" : ""}">
    <div class="n">${esc(q.name)}</div>
    <div class="p">${price}${cur ? `<small>${esc(cur)}</small>` : ""}</div>
    <div class="c ${dir}">${chg}</div>
    ${spark(q.spark, mdir)}
    <div class="w"><span>1 mo <b class="${mdir}">${q.month_pct == null ? "–" : (q.month_pct > 0 ? "+" : "") + num(q.month_pct, 1) + "%"}</b></span><span>${esc(asOf)}</span></div>
  </div>`;
}
const board = () => (DATA.markets || []).length ? `<div class="board">${DATA.markets.map(g =>
  `<div><h3>${esc(g.group)}</h3><div class="tiles">${g.items.map(tile).join("")}</div></div>`).join("")}</div>` : "";
const WIDE_LIMIT = 12;

const fmt = iso => new Date(iso).toLocaleString([], { weekday: "short", hour: "2-digit", minute: "2-digit" });

function render() {
  const cutoff = Date.now() - state.hours * 3600e3, q = state.q.toLowerCase();
  document.getElementById("main").innerHTML = DATA.sections.map(sec => {
    const key = s => sec.id + "|" + s, picked = sec.sources.filter(s => state.pick.has(key(s)));
    const list = sec.articles.filter(a =>
      (!picked.length || state.pick.has(key(a.source))) &&
      (state.kind === "all" || a.kind === state.kind) &&
      (!a.date || new Date(a.date) >= cutoff) &&
      (!q || (a.title + " " + a.summary + " " + a.source).toLowerCase().includes(q)));
    const chips = `<span class="chip ${picked.length ? "" : "on"}" data-all="${sec.id}">All</span>` + sec.sources.map(s =>
      `<span class="chip ${state.pick.has(key(s)) ? "on" : ""}" data-src="${esc(key(s))}">${esc(s)}</span>`).join("");
    const wide = sec.layout === "wide";
    // Lead with a story that has a picture, if one is near the top.
    const lead = list.slice(0, 3).findIndex(a => a.image);
    if (!wide && lead > 0) list.unshift(...list.splice(lead, 1));
    const open = state.more.has(sec.id), shown = wide && !open ? list.slice(0, WIDE_LIMIT) : list;
    const items = shown.map((a, n) => {
      const isNew = lastVisit && a.date && a.date > lastVisit;
      const pic = a.image ? `<img src="${esc(a.image)}" alt="" loading="lazy" referrerpolicy="no-referrer"
          onerror="broken(this)">` : "";
      return `<li class="${state.read.has(a.link) ? "read" : ""} ${n === 0 && !wide ? "hero" : ""}">
        <a class="thumb ${a.image ? "" : "noimg"}" href="${esc(a.link)}" target="_blank" rel="noopener" tabindex="-1"
           data-i="${esc(initials(a.source))}" style="--ph:${hue(a.source)}">${pic}</a>
        <div class="body"><div class="src"><b class="${a.kind === "independent" ? "indie" : ""}">${esc(a.source)}</b>
          <span>${ago(a.date)}</span>${isNew ? '<span class="badge">new</span>' : ""}</div>
        <a class="t" href="${esc(a.link)}" target="_blank" rel="noopener">${esc(a.title)}</a>
        ${a.summary && a.summary !== a.title ? `<div class="s">${esc(a.summary)}</div>` : ""}
      </div></li>`;
    }).join("");
    const more = wide && list.length > WIDE_LIMIT
      ? `<button class="more" data-sec="${sec.id}">${open ? "Show fewer stories" : `Show all ${list.length} stories`}</button>` : "";
    return `<section id="sec-${sec.id}" class="${state.tab === sec.id ? "active" : ""} ${wide ? "wide" : ""}">
      <h2>${esc(sec.title)} <small>${list.length} stories</small></h2>
      ${sec.board ? board() : ""}
      <div class="chips">${chips}</div>
      <ol${sec.dir ? ` dir="${sec.dir}" lang="ar"` : ""}>${items || '<div class="empty">Nothing matches.</div>'}</ol>${more}</section>`;
  }).join("");
  document.getElementById("tabs").innerHTML = DATA.sections.map(s =>
    `<button data-v="${s.id}" class="${state.tab === s.id ? "on" : ""}">${esc(s.title.split(" · ")[0])}</button>`).join("");
}

document.getElementById("stamp").textContent =
  "Updated " + fmt(DATA.generated) + " · refreshes every 30 minutes";
const bad = DATA.health.filter(h => !h.status.startsWith("ok"));
document.getElementById("foot").innerHTML = `<details><summary>Feed status: ${DATA.health.length - bad.length}/${DATA.health.length} live${bad.length ? `, ${bad.length} using cache or failed` : ""}</summary>
  <table>${DATA.health.map(h => `<tr><td>${esc(h.section)}</td><td>${esc(h.source)}</td><td>${h.count}</td>
  <td class="${h.status.startsWith("ok") ? "" : "bad"}">${esc(h.status)}</td></tr>`).join("")}</table></details>`;

document.getElementById("q").addEventListener("input", e => { state.q = e.target.value; render(); });
for (const id of ["kind", "win", "tabs"]) {
  document.getElementById(id).addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    if (id === "kind") state.kind = b.dataset.v;
    if (id === "win") state.hours = +b.dataset.v;
    if (id === "tabs") { state.tab = b.dataset.v; store.set("du.tab", state.tab); }
    if (id !== "tabs") { for (const x of e.currentTarget.children) x.classList.toggle("on", x === b); }
    render();
  });
}
document.getElementById("main").addEventListener("click", e => {
  const m = e.target.closest(".more");
  if (m) { const id = m.dataset.sec; state.more.has(id) ? state.more.delete(id) : state.more.add(id); render(); return; }
  const c = e.target.closest(".chip");
  if (c) {
    if (c.dataset.all) DATA.sections.find(x => x.id === c.dataset.all).sources.forEach(s => state.pick.delete(c.dataset.all + "|" + s));
    else { const s = c.dataset.src; state.pick.has(s) ? state.pick.delete(s) : state.pick.add(s); }
    store.set("du.pick2", [...state.pick]); render(); return;
  }
  const a = e.target.closest("a.t, a.thumb");
  if (a) { state.read.add(a.getAttribute("href")); store.set("du.read", [...state.read].slice(-1000));
           a.closest("li").classList.add("read"); }
});
render();
// Pick up new builds: check every 15 minutes (the hourly run's exact time drifts).
setInterval(() => location.reload(), 15 * 60e3);
</script>
</body>
</html>
